<style>
/* Layout: eine schmale Lernspalte, oben Marke und Serie, darunter Tagesrunde und Übungsarten. Leitmotiv: Textmarker-Gelb für das, worauf es ankommt. */
:root{
  --bg:#F1F4F5; --surface:#FFFFFF; --ink:#11202A; --muted:#566872; --line:#D5DDE1; --soft:#E7EDEF;
  --accent:#1F4FD8; --on-accent:#FFFFFF; --hl:#FFE75A;
  --good:#17794D; --good-bg:#DDF3E7; --bad:#B7322A; --bad-bg:#FBE1DE;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --f-ipa:'Noto Sans','Segoe UI','Lucida Sans Unicode',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E161B; --surface:#16222A; --ink:#E6EDF0; --muted:#92A3AD; --line:#2B3B45; --soft:#1E2C35;
    --accent:#86A2FF; --on-accent:#0B1230; --hl:#C9A91E;
    --good:#5FD19A; --good-bg:#14352A; --bad:#FF8D84; --bad-bg:#3C1E1C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161B; --surface:#16222A; --ink:#E6EDF0; --muted:#92A3AD; --line:#2B3B45; --soft:#1E2C35;
  --accent:#86A2FF; --on-accent:#0B1230; --hl:#C9A91E;
  --good:#5FD19A; --good-bg:#14352A; --bad:#FF8D84; --bad-bg:#3C1E1C; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--f-body)}
button{font-family:inherit}
.shell{padding-block:12px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;padding:0 1px}
.muted{color:var(--muted)} .small{font-size:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:8px 14px}
.brand h1{font-size:30px;letter-spacing:-.02em}
.lang{display:inline-block;margin-top:2px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.streak{text-align:right;line-height:1.1}
.streak b{font-family:var(--f-display);font-size:30px;display:block}
.streak span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:700;font-size:16px;cursor:pointer}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.stack{display:grid;gap:14px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.today h2{font-size:28px;margin:6px 0 2px}
.today .bar{margin:16px 0 6px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.btn{min-height:50px;padding:0 22px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost{background:none;color:var(--muted);min-height:44px;padding:0 10px}
.btn.block{width:100%;margin-top:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btns .btn{flex:1 1 140px}

.modes{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.mode{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--ink);font-size:17px;cursor:pointer}
.mode[disabled]{opacity:.55;cursor:not-allowed}
.mode .ico{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.mode svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode b{display:block;font-family:var(--f-display);font-size:18px}
.mode small{display:block;color:var(--muted);font-size:15px;line-height:1.3}
.mode .st{font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.set summary{cursor:pointer;font-weight:700;min-height:28px}
.lbl{margin:16px 0 8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{padding:12px 14px;border-radius:12px;background:var(--soft);font-size:15px}

.sesbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.cnt{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lv{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--soft);font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.q{font-family:var(--f-display);font-size:clamp(28px,8vw,40px);font-weight:700;line-height:1.1;margin:14px 0 6px;overflow-wrap:anywhere;text-wrap:balance}
.q.sent{font-size:clamp(22px,6vw,28px);line-height:1.25;font-weight:500}
.ipa{font-family:var(--f-ipa);color:var(--muted);font-size:16px}
.ex{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ex p+p{margin-top:6px}
.field{width:100%;min-height:54px;margin-top:16px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:18px}
textarea.field{min-height:150px;resize:vertical;line-height:1.45}
.field:focus{border-color:var(--accent);outline:none}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;border:1px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{font-size:18px;margin-bottom:4px}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opt{min-height:58px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;font-weight:600;cursor:pointer}
.opt.is-ok{border-color:var(--good);background:var(--good-bg)}
.opt.is-no{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.gapblank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ink);vertical-align:baseline}
.w-miss{background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:0 3px;font-weight:700}
.w-ok{color:var(--good);font-weight:600}
.play{display:flex;gap:10px;margin-top:6px}
.play .btn{flex:1}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.grades .btn{flex-direction:column;gap:0;min-height:62px;font-size:16px;line-height:1.2}
.grades small{font-weight:400;font-size:12px;opacity:.85}
.list{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.list li{padding:10px 12px;background:var(--soft);border-radius:10px;font-size:16px}
.errs li b{color:var(--bad)} .errs li i{font-style:normal;font-weight:700;color:var(--good)}
.corr{white-space:pre-wrap;overflow-wrap:anywhere}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:8px;height:170px;margin-top:12px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.col .b{width:100%;max-width:44px;background:var(--accent);border-radius:6px 6px 2px 2px}
.col .b.new{background:var(--line)}
.col .b.today{background:var(--ink)}
.col .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.col .l{font-size:12px;color:var(--muted);white-space:nowrap}
.cols.days{height:120px;gap:4px}
.cols.days .v{font-size:11px}
.rows{display:grid;gap:12px;margin-top:12px}
.rowline{display:grid;grid-template-columns:110px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:15px}
.rowline span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.rowline .t{overflow-wrap:anywhere}
h2.sec{font-size:20px}
#bubbles{display:flex;flex-direction:column;align-items:flex-start}
.bub{max-width:88%;padding:10px 14px;margin:6px 0;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.them{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.bub.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-top-right-radius:4px}
.bub.muted{color:var(--muted)}
#bubbles .btn.ghost{min-height:36px;font-size:14px;padding:0 4px;margin-top:-4px}
@media (prefers-reduced-motion:reduce){.bar i,.prog i{transition:none}}
/* Im Dashboard eingebettet: Hintergrund und Ränder kommen von der Dashboard-Seite */
html,body{background:transparent;margin:0}
.shell{padding:0 0 24px}
.wrap{margin:0}
@media (max-width:420px){.rowline{grid-template-columns:90px minmax(0,1fr) 52px}.grades .btn{font-size:15px}}
</style>

var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function today(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)}
function dstr(n){return new Date(n*864e5).toISOString().slice(0,10)}
function dow(n){return new Date(n*864e5).getUTCDay()}
function strip(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\([^)]*\)/g,' ').replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim()}
function core(s){return strip(s).replace(/^(to|the|a|an) /,'')}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=1;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function alts(c){return c.en.split('/').map(function(s){return s.trim()})}
function pct(o){return o&&o.n?Math.round(100*o.c/o.n)+' %':'neu'}

function defaults(){return {v:1,t:0,cards:{},days:{},gap:{},listen:{n:0,c:0},write:{n:0},talk:{n:0},set:{levels:LVL.slice(),decks:Object.keys(DECKS),accent:'en-GB'}}}
function migrate(s){
  s.talk=s.talk||{n:0};
  if(!s.set.m2){
    LVL.forEach(function(l){if(s.set.levels.indexOf(l)<0)s.set.levels.push(l)});
    Object.keys(DECKS).forEach(function(d){if(s.set.decks.indexOf(d)<0)s.set.decks.push(d)});
    s.set.m2=1;
  }
  if(!s.set.m3){
    Object.keys(DECKS).forEach(function(d){if(s.set.decks.indexOf(d)<0)s.set.decks.push(d)});
    s.set.m3=1;
  }
  if(!s.set.m5){
    ['wirtschaft','gesell','wissen','abstrakt','idiom'].forEach(function(d){if(s.set.decks.indexOf(d)<0)s.set.decks.push(d)});
    s.set.m5=1;
  }
  if(!s.set.m4){
    ['steuer','vorsorge'].forEach(function(d){if(s.set.decks.indexOf(d)<0)s.set.decks.push(d)});
    s.set.m4=1;
  }
  return s;
}
function load(){
  var s=defaults(),r=null;
  try{r=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(r&&r.v===1){s=Object.assign(s,r);s.set=Object.assign(defaults().set,r.set||{})}else{s.set.m2=1;s.set.m3=1;s.set.m4=1;s.set.m5=1}
  return migrate(s);
}

function persist(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  tellHost();
  if(REF){dirty=true;clearTimeout(timer);timer=setTimeout(flush,1500)}
}
function flush(){
  if(!REF||busy||!dirty)return;
  busy=true;dirty=false;
  REF.set({j:JSON.stringify(S),t:S.t}).catch(function(){}).then(function(){busy=false;if(dirty){clearTimeout(timer);timer=setTimeout(flush,1500)}});
}
function adopt(r){
  S=Object.assign(defaults(),r);S.set=Object.assign(defaults().set,r.set||{});S=migrate(S);
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  render();
}
function use(n){try{return window.claude&&window.claude.use?window.claude.use(n).catch(function(){return null}):Promise.resolve(null)}catch(e){return Promise.resolve(null)}}
async function initRemote(){
  var res=await Promise.all([use('db'),use('user')]);
  var db=res[0],user=res[1];
  if(!db||!user)return;
  var uid=await user.id();
  if(!uid)return;
  var ref=db.doc('data/users/'+uid+'/progress'),snap;
  try{snap=await ref.get()}catch(e){return}
  REF=ref;
  if(snap.exists){
    var r=null;try{r=JSON.parse(snap.data().j)}catch(e){}
    if(r&&r.v===1&&(r.t||0)>S.t){if(SES)PENDING=r;else adopt(r);return}
  }
  if(S.t>0){dirty=true;flush()}
}

function bump(ok,isNew){
  var k=dstr(today());
  var d=S.days[k]||(S.days[k]={n:0,c:0,nw:0});
  d.n++;if(ok)d.c++;if(isNew)d.nw=(d.nw||0)+1;
}
function grade(card,g){
  var st=S.cards[card.id]||(S.cards[card.id]={b:0,d:0,s:0,w:0});
  var isNew=st.b===0;
  st.s++;
  if(g===0){st.b=1;st.w++;st.d=today()}
  else{st.b=Math.min(5,(isNew?1:st.b)+g);st.d=today()+INT[st.b]}
  bump(g>0,isNew);persist();
}
function streak(){var t=today(),n=0;function has(x){var d=S.days[dstr(x)];return d&&d.n>0}if(!has(t))t--;while(has(t)){n++;t--}return n}

/* ---------- Planung ---------- */
function pool(){return CARDS.filter(function(c){return S.set.levels.indexOf(c.lvl)>=0&&S.set.decks.indexOf(c.deck)>=0})}
function plan(){
  var t=today(),P=pool(),dd=S.days[dstr(t)]||{};
  var due=P.filter(function(c){var s=S.cards[c.id];return s&&s.b>0&&s.d<=t}).sort(function(a,b){return S.cards[a.id].d-S.cards[b.id].d});
  var unseen=P.filter(function(c){return !S.cards[c.id]||S.cards[c.id].b===0});
  var room=Math.max(0,newMax()-(dd.nw||0));
  var fresh=shuffle(unseen).sort(function(a,b){return LV[a.lvl]-LV[b.lvl]}).slice(0,room);
  return {pool:P,due:due,fresh:fresh};
}
function startSession(mode,extra){
  var items=[],t=today(),P=pool();
  UI.msg='';
  if(mode==='cards'){
    var pl=plan();
    if(extra||(!pl.due.length&&!pl.fresh.length)){
      items=shuffle(P).sort(function(a,b){var sa=S.cards[a.id],sb=S.cards[b.id];return (sa?sa.b:0)-(sb?sb.b:0)}).slice(0,10);
    }else{
      var d=pl.due.slice(0,14),f=pl.fresh.slice();
      while(d.length||f.length){if(d.length)items.push(d.shift());if(d.length)items.push(d.shift());if(f.length)items.push(f.shift())}
    }
  }else if(mode==='translate'){
    var rank=function(c){var s=S.cards[c.id];if(s&&s.b>0&&s.d<=t)return 0;if(!s||s.b===0)return 1.5;return 1+(5-s.b)/10};
    items=shuffle(P.filter(function(c){return c.deck!=='phrasen'})).sort(function(a,b){return rank(a)-rank(b)}).slice(0,10);
  }else if(mode==='listen'){
    items=shuffle(LISTEN.filter(function(x){return S.set.levels.indexOf(x[2])>=0})).slice(0,8).map(function(x){return {en:x[0],de:x[1],l:x[2]}});
  }else if(mode==='gap'){
    items=shuffle(GAPS.filter(function(g){return S.set.levels.indexOf(g.l)>=0})).slice(0,10).map(function(g){
      var opts=shuffle(g.o.map(function(txt,i){return {txt:txt,ok:i===g.a}}));
      return {q:g.q,opts:opts,t:g.t,e:g.e,l:g.l};
    });
  }else if(mode==='write'||mode==='talk'){
    items=[1];
  }
  if(!items.length){UI.msg='Mit dieser Auswahl gibt es nichts zu üben. Wähle unter „Anpassen“ weitere Niveaus oder Themen.';render();return}
  SES={mode:mode,items:items,i:0,phase:(mode==='write'||mode==='talk')?'pick':'ask',ok:0,total:0,miss:[],req:{},autoplay:mode==='listen',done:false,msg:'',text:'',turns:[],sc:null,wait:false,nUser:0};
  VIEW='session';render();
}
function endSession(){
  if(SES&&SES.ctl)try{SES.ctl.abort()}catch(e){}
  try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
  SES=null;VIEW='home';
  if(PENDING){var r=PENDING;PENDING=null;adopt(r)}else render();
}
function nextItem(){
  var s=SES;s.i++;s.phase='ask';s.res=null;s.hint=false;
  if(s.i>=s.items.length)s.done=true;else s.autoplay=s.mode==='listen';
  render();
}

/* ---------- Sprachausgabe ---------- */
function canSpeak(){return 'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined'}
function pickVoice(){
  try{var vs=speechSynthesis.getVoices(),a=S.set.accent.toLowerCase();
  return vs.filter(function(v){return v.lang.replace('_','-').toLowerCase()===a})[0]||vs.filter(function(v){return v.lang.toLowerCase().indexOf('en')===0})[0]||null}catch(e){return null}
}
function speak(text,rate){
  if(!canSpeak())return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=S.set.accent;u.rate=rate||1;var v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- Prüfen ---------- */
function checkAnswer(card,input){
  var a=alts(card).map(core),x=core(input);
  if(!x)return {ok:false,empty:true};
  if(a.indexOf(x)>=0)return {ok:true};
  for(var i=0;i<a.length;i++){if(a[i].length>=5&&lev(a[i],x)<=1)return {ok:true,typo:true}}
  return {ok:false};
}
function nw(w){return w.toLowerCase().replace(/[^a-z0-9]/g,'')}
function diffWords(target,typed){
  var tw=target.split(/\s+/).filter(function(w){return nw(w)}),tn=tw.map(nw);
  var yn=typed.split(/\s+/).map(nw).filter(Boolean);
  var n=tn.length,m=yn.length,dp=[],i,j;
  for(i=0;i<=n;i++){dp.push(new Array(m+1).fill(0))}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)dp[i][j]=tn[i]===yn[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  var hit=new Array(n).fill(false);i=0;j=0;
  while(i<n&&j<m){if(tn[i]===yn[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  var h=hit.filter(Boolean).length;
  return {tw:tw,hit:hit,score:n?h/n:0};
}

  var learned=counts[3]+counts[4]+counts[5],t=today(),n7=0,c7=0,k;
  for(k=0;k<7;k++){var d=S.days[dstr(t-k)];if(d){n7+=d.n;c7+=d.c}}
  var maxc=Math.max.apply(null,counts.concat([1]));
  var boxes=counts.map(function(v,i){return '<div class="col"><span class="v">'+v+'</span><div class="b'+(i===0?' new':'')+'" style="height:'+Math.max(v/maxc*74,1.5)+'%"></div><span class="l">'+(i?'Box '+i:'Neu')+'</span></div>'}).join('');
  var arr=[],maxd=GOAL;
  for(k=13;k>=0;k--){var dd=S.days[dstr(t-k)],nn=dd?dd.n:0;arr.push({n:nn,day:t-k});if(nn>maxd)maxd=nn}
  var wd=['S','M','D','M','D','F','S'];
  var days=arr.map(function(x,i){return '<div class="col"><span class="v">'+(x.n||'')+'</span><div class="b'+(i===13?' today':'')+'" style="height:'+Math.max(x.n/maxd*70,1.5)+'%"></div><span class="l">'+wd[dow(x.day)]+'</span></div>'}).join('');
  var lvl=LVL.map(function(l){
    var tot=CARDS.filter(function(c){return c.lvl===l}),got=tot.filter(function(c){return (S.cards[c.id]||{b:0}).b>=3}).length;
    return '<div class="rowline"><span>'+l+'</span><div class="bar"><i style="width:'+(tot.length?got/tot.length*100:0)+'%"></i></div><span>'+got+'/'+tot.length+'</span></div>';
  }).join('');
  var tp=Object.keys(S.gap).sort(function(a,b){return S.gap[b].n-S.gap[a].n}).map(function(x){
    var o=S.gap[x];return '<div class="rowline"><span class="t">'+esc(x)+'</span><div class="bar"><i style="width:'+(o.n?o.c/o.n*100:0)+'%"></i></div><span>'+o.c+'/'+o.n+'</span></div>';
  }).join('')||'<p class="muted small">Noch kein Lückentext gelöst.</p>';
  var where=host()?'Dein Fortschritt wird im Dashboard gespeichert und mit deinen anderen Geräten synchronisiert.':REF?'Dein Fortschritt wird in deinem Claude-Konto gespeichert und folgt dir auf andere Geräte.':'Dein Fortschritt wird nur in diesem Browser gespeichert.';
  var reset=UI.confirm?'<p class="small">Wirklich alles löschen? Das lässt sich nicht rückgängig machen.</p><div class="btns"><button class="btn sec" data-act="resetno">Abbrechen</button><button class="btn primary" data-act="resetyes">Fortschritt löschen</button></div>':'<button class="btn ghost" data-act="reset">Fortschritt zurücksetzen</button>';
  return '<div class="stack"><div class="stats"><div class="card stat"><b>'+streak()+'</b><span>Tage in Folge</span></div><div class="card stat"><b>'+learned+'</b><span>von '+CARDS.length+' sitzen</span></div><div class="card stat"><b>'+(n7?Math.round(100*c7/n7):0)+' %</b><span>richtig, 7 Tage</span></div></div>'+
    '<section class="card"><h2 class="sec">Vokabeln nach Box</h2><p class="small muted">Box 1 kommt täglich wieder, Box 5 alle 16 Tage.</p><div class="cols">'+boxes+'</div></section>'+
    '<section class="card"><h2 class="sec">Antworten pro Tag</h2><p class="small muted">Letzte 14 Tage, Ziel '+GOAL+'.</p><div class="cols days">'+days+'</div></section>'+
    '<section class="card"><h2 class="sec">Wortschatz nach Niveau</h2><p class="small muted">Gezählt werden Karten ab Box 3.</p><div class="rows">'+lvl+'</div></section>'+
    '<section class="card"><h2 class="sec">Grammatik nach Thema</h2><div class="rows">'+tp+'</div></section>'+
    '<p class="small muted">'+where+'</p>'+reset+'</div>';
}

function normFb(r){
  r=r||{};
  return {corrected:String(r.corrected||''),level:String(r.level||''),praise:String(r.praise||''),tip:String(r.tip||''),
    errors:(Array.isArray(r.errors)?r.errors:[]).slice(0,6).map(function(x){x=x||{};return {wrong:String(x.wrong||''),right:String(x.right||''),why:String(x.why||'')}}),
    phrases:(Array.isArray(r.phrases)?r.phrases:[]).slice(0,5).map(function(x){x=x||{};return {en:String(x.en||''),de:String(x.de||'')}})};
}

function talkView(){
  var s=SES,h='<div class="sesbar"><button class="btn ghost" data-act="quit">Beenden</button>'+(s.sc?'<span class="cnt" style="flex:1;text-align:right">'+esc(s.sc.t)+'</span>':'')+'</div>';
  if(s.phase==='pick'){
    return h+'<div class="card"><h2 class="sec">Welches Gespräch möchtest du üben?</h2><p class="muted small" style="margin-top:4px">Claude spielt dein Gegenüber, du antwortest auf Englisch. Danach folgt eine Auswertung auf Deutsch.</p><ul class="list">'+
      SCEN.map(function(x,i){return '<li><button class="mode" style="grid-template-columns:minmax(0,1fr) auto" data-act="tpick" data-i="'+i+'"><span><b>'+esc(x.t)+'</b></span><span class="lv">'+x.l+'</span></button></li>'}).join('')+'</ul></div>';
  }
  if(s.phase==='fb')return writeView();
  var bub=s.turns.map(function(t){
    return t.role==='user'?'<div class="bub me">'+esc(t.content)+'</div>':'<div class="bub them">'+esc(t.content)+'</div>'+(canSpeak()?'<button class="btn ghost" data-act="speak" data-t="'+esc(t.content)+'" data-r="1">Anhören</button>':'');
  }).join('');
  if(s.wait)bub+='<div class="bub them muted">'+(s.evaluating?'Auswertung läuft …':'…')+'</div>';
  var last=s.turns[s.turns.length-1];
  var canRetry=!s.wait&&!!s.msg&&(!last||last.role==='user');
  return h+'<div id="bubbles">'+bub+'</div>'+
    (s.msg?'<p class="notice" style="margin-top:10px">'+esc(s.msg)+'</p>':'')+
    (canRetry?'<button class="btn sec block" data-act="tretry">Erneut versuchen</button>':'')+
    '<textarea class="field" id="talktxt" rows="3" autocapitalize="sentences" spellcheck="false" aria-label="Deine Antwort auf Englisch"'+(s.wait||canRetry?' disabled':'')+'></textarea>'+
    '<p class="small muted" style="margin-top:6px">Strg+Eingabe oder Cmd+Eingabe sendet.</p>'+
    '<div class="btns">'+(s.wait?'<button class="btn sec" data-act="stopw">Abbrechen</button>':'<button class="btn primary" data-act="tsend"'+(canRetry?' disabled':'')+'>Senden</button>'+(s.nUser>=1?'<button class="btn sec" data-act="teval">Auswertung</button>':''))+'</div>';
}
function talkRules(s){
  var sc=s.sc;
  return 'You are role-playing in a business English practice conversation. Setting: '+sc.setting+'. You play '+sc.role+'. The learner is a German-speaking financial and practice-establishment consultant for doctors, dentists and pharmacists, practising professional English at about level '+sc.l+'. Rules: Reply only in English and stay in character. Write 1 to 3 short sentences per reply. Make one point or ask one question at a time so that the learner has to respond. Use realistic professional vocabulary, slightly above the learner\'s level, but never correct the learner during the conversation. Never break character. Start the conversation now with your first line.';
}
async function talkReply(s){
  s.wait=true;s.msg='';s.ctl=new AbortController();render();
  var sig=s.ctl.signal;
  try{
    var sm=await samplePromise;
    if(!sm)throw {code:'not_granted'};
    var msgs=[{role:'user',content:talkRules(s)}].concat(s.turns);
    var r=await sm(msgs,{signal:sig,cache:false,modelTier:'quick'});
    if(SES!==s)return;
    s.turns.push({role:'assistant',content:r.text.trim()});
  }catch(e){
    if(SES!==s)return;
    if(!e||e.code!=='cancelled')s.msg=errCopy(e&&e.code);
  }
  s.wait=false;render();
}
function talkSend(){
  var s=SES,el=$('#talktxt');
  if(!s||s.wait||!el)return;
  var t=el.value.trim();if(!t)return;
  s.turns.push({role:'user',content:t});s.nUser++;
  bump(true,false);persist();talkReply(s);
}
async function talkEval(s){
  if(s.wait||!s.nUser)return;
  s.wait=true;s.evaluating=true;s.msg='';s.ctl=new AbortController();render();
  var sig=s.ctl.signal;
  var transcript=s.turns.map(function(t){return (t.role==='user'?'Lernende Person: ':'Gegenüber: ')+t.content}).join('\n');
  var prompt='Du bist ein erfahrener Englischlehrer für deutschsprachige Fach- und Führungskräfte. Unten steht ein Rollenspiel-Gespräch auf Englisch. Szenario: '+s.sc.setting+'. Bewerte nur die Beiträge der lernenden Person (Zielniveau '+s.sc.l+').\n\n'+transcript+'\n\n'+
    'Antworte ausschließlich mit einem JSON-Objekt dieser Form (alle Erklärungen auf Deutsch, knapp):\n'+
    '{"level":"<geschätztes GER-Niveau, z. B. B2>","praise":"<ein konkreter Satz, was gut gelungen ist>","errors":[{"wrong":"<Textstelle der lernenden Person>","right":"<Korrektur>","why":"<Erklärung, höchstens 20 Wörter>"}],"phrases":[{"en":"<nützliche englische Formulierung für dieses Szenario>","de":"<deutsche Entsprechung>"}],"tip":"<ein konkreter Übungstipp>","corrected":""}\n'+
    'Nenne höchstens 6 Fehler, die wichtigsten zuerst, und genau 3 Formulierungen. Das Feld corrected bleibt leer.';
  try{
    var sm=await samplePromise;
    if(!sm||typeof sm.json!=='function')throw {code:'not_granted'};
    var r=await sm.json(prompt,{signal:sig});
    if(SES!==s)return;
    s.fb=normFb(r);s.phase='fb';
  }catch(e){
    if(SES!==s)return;
    if(!e||e.code!=='cancelled')s.msg=errCopy(e&&e.code);
  }
  s.wait=false;s.evaluating=false;render();
}

function render(keep){
  var app=$('#app'),h;
  if(VIEW==='session'&&SES)h=sessionView();
  else{h=header()+tabs()+(VIEW==='progress'?progressView():homeView())}
  app.innerHTML=h;
  if(VIEW==='session'&&SES){
    var a=$('#ans')||$('#wtxt')||$('#talktxt');
    if(a&&!a.disabled)try{a.focus({preventScroll:true})}catch(e){}
    if(SES.autoplay&&SES.phase==='ask'&&!SES.done){SES.autoplay=false;speak(SES.items[SES.i].en,1)}
  }
  fitHost();
  if(VIEW==='session'&&SES&&SES.mode==='talk'&&SES.phase==='chat')scrollHost(true);
  else if(!keep)scrollHost(false);
}
function rerender(){var y=window.scrollY;render(true);window.scrollTo(0,y)}

/* ---------- Aktionen ---------- */
function errCopy(c){
  if(c==='not_granted'||c==='sampling_disabled')return 'Claude wurde für diese Seite nicht freigegeben. Erlaube es beim nächsten Versuch.';
  if(c==='rate_limited')return 'Zu viele Anfragen. Warte einen Moment und versuche es erneut.';
  if(c==='invalid_json')return 'Die Auswertung war nicht lesbar. Versuche es noch einmal.';
  return 'Die Korrektur hat nicht geklappt. Versuche es noch einmal.';
}
async function correct(){
  var s=SES,txt=($('#wtxt')||{}).value||'';
  txt=txt.trim();s.text=txt;
  if(txt.split(/\s+/).length<3){s.msg='Schreibe bitte mindestens einen vollständigen Satz.';render();return}
  s.msg='';s.phase='busy';s.ctl=new AbortController();render();
  var sig=s.ctl.signal;
  var prompt='Du bist ein freundlicher Englischlehrer für deutschsprachige Lernende. Das Niveau der lernenden Person ist etwa '+s.level+'. Aufgabe war: '+s.task+'\n\nText der lernenden Person:\n"""\n'+txt+'\n"""\n\n'+
    'Antworte ausschließlich mit einem JSON-Objekt dieser Form (alle Erklärungen auf Deutsch, knapp):\n'+
    '{"corrected":"<der Text, sprachlich korrigiert, so nah wie möglich am Original>","level":"<geschätztes GER-Niveau, z. B. B1>","errors":[{"wrong":"<fehlerhafte Textstelle>","right":"<Korrektur>","why":"<Erklärung auf Deutsch, höchstens 20 Wörter>"}],"praise":"<ein konkreter Satz, was gut gelungen ist>","tip":"<ein konkreter Übungstipp>"}\n'+
    'Nenne höchstens 6 Fehler, die wichtigsten zuerst. Ist der Text fehlerfrei, gib eine leere errors-Liste zurück.';
  try{
    var sm=await samplePromise;
    if(!sm||typeof sm.json!=='function')throw {code:'not_granted'};
    var r=await sm.json(prompt,{signal:sig});
    if(SES!==s)return;
    s.fb={corrected:String(r.corrected||''),level:String(r.level||''),praise:String(r.praise||''),tip:String(r.tip||''),
      errors:(Array.isArray(r.errors)?r.errors:[]).slice(0,6).map(function(x){return {wrong:String(x.wrong||''),right:String(x.right||''),why:String(x.why||'')}})};
    s.phase='fb';S.write.n++;bump(true,false);persist();
  }catch(e){
    if(SES!==s)return;
    s.phase='edit';
    if(!e||e.code!=='cancelled')s.msg=errCopy(e&&e.code);
  }
  render();
}

function act(a,d){
  d=d||{};var s=SES,c=s&&s.items?s.items[s.i]:null;
  if(a==='tab'){VIEW=d.v;UI.confirm=false;UI.msg='';render()}
  else if(a==='start'){startSession(d.mode,d.extra)}
  else if(a==='quit'){endSession()}
  else if(a==='flip'){s.phase='fb';render()}
  else if(a==='grade'){
    var g=+d.g;grade(c,g);s.total++;
    if(g>0)s.ok++;else{s.miss.push({a:c.de,b:alts(c).join(' / ')});if(!s.req[c.id]){s.req[c.id]=1;s.items.push(c)}}
    nextItem();
  }
  else if(a==='check'){
    if(!s||s.phase!=='ask')return;
    var inp=($('#ans')||{}).value||'';
    if(s.mode==='translate'){
      var r=checkAnswer(c,inp);
      if(r.empty)return;
      r.input=inp.trim();s.res=r;s.phase='fb';s.total++;
      if(r.ok)s.ok++;else s.miss.push({a:c.de,b:alts(c).join(' / ')});
      grade(c,r.ok?1:0);render();
    }else if(s.mode==='listen'){
      if(!inp.trim())return;
      var dw=diffWords(c.en,inp),ok=dw.score>=0.85;
      s.res={ok:ok,d:dw,input:inp.trim()};s.phase='fb';s.total++;
      if(ok)s.ok++;else s.miss.push({a:c.en,b:c.de});
      S.listen.n++;if(ok)S.listen.c++;bump(ok,false);persist();render();
    }
  }
  else if(a==='opt'){
    if(s.phase!=='ask')return;
    var i=+d.i,ok2=c.opts[i].ok;
    s.res={ok:ok2,pick:i};s.phase='fb';s.total++;
    if(ok2)s.ok++;else s.miss.push({a:c.q.replace('___',c.opts.filter(function(o){return o.ok})[0].txt),b:''});
    var g2=S.gap[c.t]||(S.gap[c.t]={n:0,c:0});g2.n++;if(ok2)g2.c++;
    bump(ok2,false);persist();render();
  }
  else if(a==='next'){nextItem()}
  else if(a==='speak'){speak(d.t,+d.r||1)}
  else if(a==='hint'){var hb=$('#hintbox');if(hb)hb.hidden=false;var hbtn=document.querySelector('[data-act="hint"]');if(hbtn)hbtn.hidden=true}
  else if(a==='set'){
    if(d.k==='accent'){S.set.accent=d.v}
    else if(d.k==='nm'){S.set.nm=+d.v}
    else{var arr=S.set[d.k],ix=arr.indexOf(d.v);if(ix>=0){if(arr.length>1)arr.splice(ix,1)}else arr.push(d.v)}
    UI.msg='';persist();rerender();
  }
  else if(a==='wpick'){var p=PROMPTS[+d.i];s.task=p.t;s.level=p.l;s.phase='edit';s.text='';s.msg='';render()}
  else if(a==='wfree'){var lv=LVL.filter(function(l){return S.set.levels.indexOf(l)>=0}).pop()||'B1';s.task='Freier Text auf Englisch.';s.level=lv;s.phase='edit';s.text='';s.msg='';render()}
  else if(a==='wcorrect'){correct()}
  else if(a==='stopw'){if(s.ctl)s.ctl.abort()}
  else if(a==='wedit'){s.phase='edit';s.msg='';render()}
  else if(a==='wnew'){s.phase='pick';s.text='';s.msg='';render()}
  else if(a==='tpick'){s.sc=SCEN[+d.i];S.talk.n++;persist();s.phase='chat';s.turns=[];s.nUser=0;talkReply(s)}
  else if(a==='tsend'){talkSend()}
  else if(a==='tretry'){talkReply(s)}
  else if(a==='teval'){talkEval(s)}
  else if(a==='tnew'){s.phase='pick';s.turns=[];s.nUser=0;s.fb=null;s.msg='';s.sc=null;render()}
  else if(a==='preset'){
    if(d.v==='start'){S.set.levels=['A1','A2','B1'];S.set.decks=['grund','verben','zahlen','essen','koerper','haus','stadt','natur','leute','freizeit','kommun','arbeit','adj','alltag','reise']}
    else if(d.v==='beratung'){S.set.levels=['B1','B2','C1','C2'];S.set.decks=['beruf','finanz','anlage','versich','praxis','phrasen','stil','steuer','vorsorge','wirtschaft','idiom']}
    else{S.set.levels=LVL.slice();S.set.decks=Object.keys(DECKS)}
    persist();rerender();
  }
  else if(a==='reset'){UI.confirm=true;rerender()}
  else if(a==='resetno'){UI.confirm=false;rerender()}
  else if(a==='resetyes'){var keep=S.set;S=defaults();S.set=keep;UI.confirm=false;persist();rerender()}
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  act(el.dataset.act,el.dataset);
});
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='set')UI.setOpen=e.target.open},true);
document.addEventListener('keydown',function(e){
  if(!SES||VIEW!=='session'||SES.done)return;
  var t=e.target,tag=t&&t.tagName;
  if(e.key==='Enter'&&t&&t.id==='ans'&&!e.shiftKey){e.preventDefault();act('check');return}
  if(e.key==='Enter'&&t&&t.id==='talktxt'&&(e.ctrlKey||e.metaKey)){e.preventDefault();act('tsend');return}
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(SES.mode==='cards'){
    if((e.key===' '||e.key==='Enter')&&SES.phase==='ask'){e.preventDefault();act('flip')}
    else if(SES.phase==='fb'&&(e.key==='1'||e.key==='2'||e.key==='3')){e.preventDefault();act('grade',{g:String(+e.key-1)})}
  }else if(SES.mode!=='write'&&SES.mode!=='talk'&&SES.phase==='fb'&&e.key==='Enter'){e.preventDefault();act('next')}
});
document.addEventListener('visibilitychange',function(){if(document.hidden)flush()});
if(canSpeak()){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){}}catch(e){}}

// Neuer Stand aus der Cloud (vom Dashboard geladen): übernehmen, wenn er jünger ist
window.addEventListener('storage',function(e){
  if(e.key!==KEY||!e.newValue)return;
  var r=null;try{r=JSON.parse(e.newValue)}catch(x){}
  if(r&&r.v===1&&(r.t||0)>S.t){if(SES)PENDING=r;else adopt(r)}
});
if(window.ResizeObserver){try{new ResizeObserver(fitHost).observe(document.querySelector('.shell'))}catch(e){}}

/* ---------- Start ---------- */
applyTheme();
render();
samplePromise=use('sample').then(function(sm){SAMPLE=sm;if(sm===null&&VIEW==='home'&&!SES)render();return sm});
initRemote();
})();
</script>
